# First deploy only: serves the ACME challenge until a certificate exists,
# then deploy/install.sh swaps in quipcall.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name quipcall.com www.quipcall.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/quipcall-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://quipcall.com$request_uri;
    }
}
