# quipcall.com: web client, API and LiveKit signalling behind TLS.
# Media doesn't pass through nginx: clients reach LiveKit directly on
# UDP 7882 (TCP 7881 when UDP is blocked).

map $http_upgrade $quipcall_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name quipcall.com www.quipcall.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/quipcall-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://quipcall.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.quipcall.com;

    ssl_certificate /etc/letsencrypt/live/quipcall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quipcall.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://quipcall.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quipcall.com;

    ssl_certificate /etc/letsencrypt/live/quipcall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quipcall.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # Room links stay out of other sites' logs.
    add_header Referrer-Policy no-referrer always;

    root /opt/quipcall/web;
    index index.html;

    # Only nginx may invoke the signaling authorization subrequest.
    location = /api/media/check { return 404; }
    location = /_quipcall_media_auth {
        internal;
        proxy_pass http://127.0.0.1:4600/api/media/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiveKit signalling (WebSocket). Lives as long as the call.
    location /rtc {
        # Also checks refreshed/replayed LiveKit tokens against room membership.
        auth_request /_quipcall_media_auth;
        # Signaling URLs contain bearer tokens.
        access_log off;
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $quipcall_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # The Mac app and its install script.
    location /download/ {
        alias /opt/quipcall/download/;
        expires -1;
    }

    # Vite's hashed bundles never change.
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
