[package]
name = "quipcall-stt"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
parking_lot = "0.13.0"
tracing = "0.1.44"
# Speech to text on ggml: Parakeet, Qwen3-ASR and Silero VAD, with Metal on
# Apple Silicon. Young (one maintainer), so pinned; see docs/ARCHITECTURE.md.
transcribe-cpp = "=0.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
# An autorelease pool per run: ggml's Metal objects would pile up otherwise.
objc2 = "0.6"
