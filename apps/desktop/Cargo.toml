[package]
name = "quipcall-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
quipcall-core.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1.0.104"
tracing = "0.1.44"
parking_lot = "0.13.0"
async-channel = "2.5.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
