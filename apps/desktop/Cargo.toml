[package]
name = "quipcall-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Dev only: QUIPCALL_SNAPSHOT_DIR=… renders every window to PNG (see src/snapshot.rs).
snapshot = ["gpui_platform/test-support", "dep:image"]

[dependencies]
quipcall-core.workspace = true
quipcall-protocol.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1.0.104"
tracing = "0.1.44"
parking_lot = "0.13.0"
async-channel = "2.5.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSButton", "NSControl", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPath"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSPathUtilities", "NSString"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "CATransform3D", "objc2-core-foundation", "objc2-core-graphics"] }
